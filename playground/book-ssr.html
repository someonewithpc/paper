<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper, server-rendered book</title>
  <link rel="stylesheet" href="/dist/styles.css">
  <link rel="stylesheet" href="/playground/demo.css">
</head>
<body>
  <main>
    <h1>Server-rendered book</h1>
    <!-- book -->
  </main>
  <script type="module">
    import { createPaper } from '/dist/index.js';
    const events = (window.paperEvents = []);
    window.paper = createPaper(document.querySelector('[data-paper-book]'));
    for (const type of ['paper:turnstart', 'paper:turnend', 'paper:change', 'paper:settle']) {
      window.paper.on(type, (event) => events.push({ type, detail: event.detail }));
    }
  </script>
</body>
</html>
